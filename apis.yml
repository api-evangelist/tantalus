name: Tantalus
description: 'Tantalus Systems (TSX: GRID; OTCQX: TGMPF) is a technology company that
  has served public power utilities and electric cooperatives for over 35 years, modernizing
  electrical distribution grids through data-centric solutions. Its Tantalus Grid Modernization
  Platform (TGMP) unifies intelligence across the distribution grid, connecting metering,
  load and DER management, grid automation, and data management across both legacy and
  modern infrastructure. Product lines include TRUConnect advanced metering infrastructure
  (AMI), TRUFlex load and DER management, TRUGrid automation analytics, TRUSync grid
  data management, and the TRUSense behind-the-meter gateway. Tantalus does not currently
  publish a public developer API, OpenAPI specification, or developer portal; integration
  with back-end utility software is delivered through standard data formats and handled
  via its technical support and integration teams.'
